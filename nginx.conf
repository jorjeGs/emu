server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # WASM correcto
  types { application/wasm wasm; }
  # ROMs como binario
  location /roms/ { add_header Cache-Control "public, max-age=86400"; }
  location /core/ { add_header Cache-Control "public, max-age=86400"; }
  # SPA fallback simple
  location / { try_files $uri $uri/ /index.html; }
}
